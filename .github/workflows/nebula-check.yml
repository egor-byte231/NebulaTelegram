name: Nebula Android build check
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/nebula-check.yml'
      - 'TMessagesProj/**'
      - 'TMessagesProj_App/**'
      - 'Tools/nebula_validate.py'
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Nebula source files
        run: python3 Tools/nebula_validate.py
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;21.4.7075529' 'cmake;3.22.1'
      - name: Build debug APK (experimental)
        run: bash ./gradlew :TMessagesProj_App:assembleDebug --no-daemon --stacktrace
      - name: Upload APK if produced
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nebula-debug-apk
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: ignore
      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nebula-build-reports
          path: |
            **/build/reports/**
          if-no-files-found: ignore
